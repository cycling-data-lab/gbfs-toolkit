name: Docs

# Versioned docs with mike, published to the gh-pages branch.
#   - push to main            -> the moving "dev" docs (/dev/)
#   - a release (called from release-please.yml with `version`, or run by hand)
#                             -> the released minor (/2.0/) and the "latest" alias (default)
# One-time: repo Settings → Pages → Source = "Deploy from a branch" → gh-pages.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: "Released version, e.g. 2.0.1"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to (re)deploy as latest, e.g. 2.0.1 (empty: dev)"
        required: false
        type: string
      dry_run:
        description: "Build and run mike on the runner without pushing to gh-pages"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialise gh-pages deploys: a main push and a release must not race to push the
# same branch (the loser is rejected with "fetch first").
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay on: mike pushes the built site to gh-pages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # A release deploys the docs of its tag, not of whatever main has become.
          ref: ${{ inputs.version && format('gbfs-toolkit-v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # A broken page must never reach gh-pages: build strictly first, as the Docs job of CI does.
      - name: Build the site (strict)
        run: mkdocs build --strict
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # With dry_run, mike commits to a local gh-pages branch on the runner and pushes nothing.
      - name: Deploy development docs
        if: ${{ !inputs.version }}
        env:
          PUSH: ${{ inputs.dry_run && ' ' || '--push' }}
        run: mike deploy $PUSH dev
      - name: Deploy released docs
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          PUSH: ${{ inputs.dry_run && ' ' || '--push' }}
        run: |
          MINOR="${VERSION%.*}"
          mike deploy $PUSH --update-aliases "$MINOR" latest
          mike set-default $PUSH latest
      - name: List the versions
        run: mike list
