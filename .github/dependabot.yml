version: 2
# Gentle: GitHub Actions only, monthly, grouped into one PR.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let a new action release age a week before it is proposed (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
